import nu.studer.gradle.jooq.JooqGenerate

plugins {
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'nu.studer.jooq' version '9.0'
    id 'org.flywaydb.flyway' version '11.3.4'
}

apply plugin: 'java'
group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    runtimeOnly 'org.postgresql:postgresql:42.6.0' // PostgreSQL driver

    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    implementation 'org.jooq:jooq:3.19.20' // Ensure consistent jOOQ version
    jooqGenerator 'org.jooq:jooq-meta:3.19.20'
    jooqGenerator 'org.jooq:jooq-codegen:3.19.20'
    jooqGenerator 'org.postgresql:postgresql:42.6.0' // PostgreSQL driver for jOOQ

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.flywaydb:flyway-database-postgresql:11.3.4'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JooqGenerate).configureEach { enabled = enabled }
flyway {
    url = 'jdbc:postgresql://localhost:5432/postgres'
    user = 'workreport_user'
    password = 'userpass'
    schemas = ['public']
    locations = ['classpath:db/migration']
    baselineOnMigrate = true
    cleanDisabled = false
}

jooq {
    version = '3.19.20'

    configurations {
        main {
            generationTool {
                jdbc {
                    driver = 'org.postgresql.Driver'
                    url = 'jdbc:postgresql://localhost:5432/postgres'
                    user = 'workreport_user'
                    password = 'userpass'
                }
                generator {
                    database {
                        name = 'org.jooq.meta.postgres.PostgresDatabase'
                        inputSchema = 'public'
                        includes = '.*'
                    }
                    target {
                        packageName = 'com.example.jooq'
                        directory = layout.buildDirectory.dir("generated/sources/jooq/main").get().asFile.absolutePath
                    }
                }
            }
        }
    }
}

