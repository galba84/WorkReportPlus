services:
  mariadb:
    image: mariadb:11.1
    container_name: mariadb_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: adm
      MYSQL_DATABASE: work_report_db
      MYSQL_USER: workreport_user
      MYSQL_PASSWORD: userpass
    ports:
      - "3307:3306"  # Changed to avoid conflicts with local MySQL
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - workreport_network

  springboot-app:
    build:
      context: .  # 👈 This tells Docker Compose to use the current directory (which contains Dockerfile)
    container_name: workreportplus_app
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/work_report_db
      SPRING_DATASOURCE_USERNAME: workreport_user
      SPRING_DATASOURCE_PASSWORD: userpass
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
    depends_on:
      - mariadb
    ports:
      - "8080:8080"
    networks:
      - workreport_network

volumes:
  mariadb_data:

networks:
  workreport_network:
    driver: bridge
