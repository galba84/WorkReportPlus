name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Check public source
        run: node scripts/check-public.mjs
      - name: Build backend and run PostgreSQL integration tests
        run: bash gradlew clean build --console=plain
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Start demo from packaged artifacts
        run: docker compose up --build --wait --wait-timeout 120
      - name: Verify browser workflow
        working-directory: frontend
        run: npx playwright test
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            frontend/test-results/
      - name: Stop demo
        if: always()
        run: docker compose down
