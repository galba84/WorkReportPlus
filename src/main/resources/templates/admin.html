<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras/springsecurity5">
<head>
    <meta charset="UTF-8">
    <title th:text="#{page.title.admin}">ADMIN PAGE</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- Include the header fragment -->
<div th:insert="~{fragments/header :: body}">
    <th:block th:with="infoMessage=#{welcome.message}"></th:block>
</div>

<h1 th:text="#{page.heading.admin}">Welcome to the ADMIN Page</h1>

<p th:text="#{page.label.roles}">Current User Roles:</p>
<p th:each="authority : ${#authentication.getAuthorities()}">
    <span th:text="${authority.getAuthority().replace('ROLE_', '')}"></span>
</p>

</body>
</html>
