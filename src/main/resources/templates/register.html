<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Register User</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        body {
            background-image: url('/img/banner1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .form-container {
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            margin: 80px auto;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        h2 {
            text-align: center;
            color: white;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border-radius: 5px;
            border: none;
        }

        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }

        p a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #aad8ff;
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #ff4d4d;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h2>Register</h2>

<div class="form-container">
    <form th:action="@{/register}" th:object="${user}" method="post">
        <label>Email:
            <input type="email" th:field="*{email}" required />
        </label>

        <label>Password:
            <input type="password" th:field="*{password}" required />
        </label>

        <label>Nickname:
            <input type="text" th:field="*{nickname}" required />
        </label>

        <button type="submit">Register</button>
    </form>

    <p th:if="${error}" th:text="${error}" class="error-message"></p>
    <p><a th:href="@{/login}">Back to login</a></p>
</div>

</body>
</html>
