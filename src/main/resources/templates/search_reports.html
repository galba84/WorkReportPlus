<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Reports</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:insert="~{fragments/header :: body}"></div>

<h2>Search Reports</h2>

<form th:action="@{/api/daily-work-report/search}" method="GET">
    <label for="startDate">Start Date:</label>
    <input type="date" id="startDate" name="startDate" required>

    <label for="endDate">End Date:</label>
    <input type="date" id="endDate" name="endDate" required>

    <label for="region">Region:</label>
    <select id="region" name="region">
        <option value="">-- Select Region --</option>
        <option value="North">North</option>
        <option value="South">South</option>
        <option value="East">East</option>
        <option value="West">West</option>
    </select>

    <button type="submit">Search</button>
</form>

<div id="results">
    <h3>Search Results</h3>
    <table class="full-width-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Report Date</th>
            <th>Region</th>
            <th>Description</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="report : ${reports}">
            <td th:text="${report.id}"></td>
            <td th:text="${report.date}"></td>
            <td th:text="${report.region}"></td>
            <td th:text="${report.description}"></td>
            <td>
                <a th:href="@{/api/daily-work-report/view/{id}(id=${report.id})}">Open</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
