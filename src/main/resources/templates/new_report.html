<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{page.title.newReport}">New Report</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        select option:disabled {
            color: #aaa;
            background-color: #eee;
        }

        .contractor-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-weight: bold;
            color: black;
        }

        .contractor-entry span {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .contractor-entry button {
            background-color: #007bff;
            border: none;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-left: 10px;
        }

        .contractor-entry button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="blur-overlay"></div>
<div class="main-content">
    <!-- your existing page content -->
<div th:insert="~{fragments/header :: body}"></div>

<h2 th:text="#{form.heading}">Submit New Region Report</h2>

<div th:if="${successMessage}" class="message-center success-message">
    <p th:text="${successMessage}"></p>
</div>

<div th:if="${errorMessage}" style="color: red;">
    <p th:text="${errorMessage}"></p>
</div>

<div class="form-container">
    <form id="regionReportForm" th:action="@{/api/daily-work-report}" method="post">
        <input type="hidden" name="status" value="true">

        <label for="reportDate" th:text="#{form.reportDate}">Report Date:</label>
        <input type="date" id="reportDate" name="reportDate" required>

        <label for="regionName" th:text="#{form.region}">Region:</label>
        <select id="regionName" name="regionName" required>
            <option th:text="#{form.selectRegion}" value="">-- Select Region --</option>
            <option th:each="region : ${regions}" th:value="${region.id}" th:text="${region.regionName}"></option>
        </select>

        <label for="regionDescription" th:text="#{form.description}">Description:</label>
        <textarea id="regionDescription" name="regionDescription" rows="1"
                  style="resize: vertical; min-height: 1.5em;"></textarea>

        <div class="frame">
            <h3 th:text="#{form.arrivedContractors}">Arrived</h3>
            <div id="arrivedContractorsContainer"></div>
        </div>

        <div class="frame">
            <h3 th:text="#{form.departedContractors}">Departed</h3>
            <div id="departedContractorsContainer"></div>
        </div>

        <div class="frame">
            <h4>Additional Contractors</h4>
            <div>
                <select id="manualContractorSelect"></select>
                <button type="button" id="addToArrived">+ To Arrived</button>
                <button type="button" id="addToDeparted">+ To Departed</button>
            </div>
        </div>

        <h3 th:text="#{form.additionalData}">Additional Data</h3>
        <div id="extraDataContainer"></div>
        <template id="extraDataTemplate">
            <div class="extraDataEntry">
                <input type="text" name="extraData[key][]" placeholder="Key">
                <input type="text" name="extraData[value][]" placeholder="Value">
                <button type="button" class="removeExtraData">Remove</button>
            </div>
        </template>
        <button type="button" id="addExtraData">+ Add Extra Data</button>

        <h3 th:text="#{form.groupReports}">Group Reports</h3>
        <div id="groupReportsContainer"></div>
        <button type="button" id="addGroupReport">+ Add Group Report</button>

        <button type="submit" th:text="#{form.submit}">Submit Report</button>
    </form>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    let groups = /*[[${groups}]]*/ [];
    let groupIndex = 0;

    let labels = {
        remove: /*[[#{form.remove}]]*/ 'Remove',
        groupName: /*[[#{form.groupName}]]*/ 'Group Name',
        description: /*[[#{form.description}]]*/ 'Description',
        selectGroup: /*[[#{form.selectGroup}]]*/ 'Select Group'
    };

    function contractorLabel(c) {
        const fullName = `${c.firstName || ''} ${c.lastName || ''}`.trim();
        const nickname = c.nickName?.trim();
        return nickname ? `${fullName} (${nickname})` : fullName;
    }

    function createContractorInput(name, id, label) {
        return `<div class="contractor-entry">
                <input type="hidden" name="${name}" value="${id}" />
                <span>${label}</span>
                <button type="button" class="removeContractor">✖</button>
            </div>`;
    }

    function loadContractorsForSelectedDateAndRegion() {
        const date = $("#reportDate").val();
        const regionId = $("#regionName").val();
        if (!date || !regionId) return;

        fetch(`/api/daily-work-report/contractors?date=${date}`)
            .then(res => res.json())
            .then(data => {
                const usedIds = new Set();
                const arrived = data.arrived?.[regionId] || [];
                const departed = data.departed?.[regionId] || [];
                const additional = data.contractorsAll?.all || [];

                $("#arrivedContractorsContainer").empty();
                $("#departedContractorsContainer").empty();
                $("#manualContractorSelect").empty();

                arrived.forEach(c => {
                    const label = contractorLabel(c);
                    usedIds.add(c.id);
                    $("#arrivedContractorsContainer").append(createContractorInput("arrivedContractorIds", c.id, label));
                });

                departed.forEach(c => {
                    const label = contractorLabel(c);
                    usedIds.add(c.id);
                    $("#departedContractorsContainer").append(createContractorInput("departedContractorIds", c.id, label));
                });

                additional.filter(c => !usedIds.has(c.id)).forEach(c => {
                    $("#manualContractorSelect").append(`<option value="${c.id}">${contractorLabel(c)}</option>`);
                });
            })
            .catch(err => console.error("Failed to load contractors:", err));
    }

    function bindMutualExclusion(fightId, restId) {
        const fightSelect = $(`#${fightId}`);
        const restSelect = $(`#${restId}`);

        function updateOptions(source, target) {
            const selected = new Set(source.val() || []);
            target.find("option").each(function () {
                $(this).prop("disabled", selected.has($(this).val()));
            });
        }

        fightSelect.on("change", () => updateOptions(fightSelect, restSelect));
        restSelect.on("change", () => updateOptions(restSelect, fightSelect));
        fightSelect.trigger("change");
        restSelect.trigger("change");
    }

    function addGroupReportEntry(filteredGroups) {
        const localGroupIndex = groupIndex;
        const groupOptions = filteredGroups.map(group =>
            `<option value="${group.id}" data-group='${JSON.stringify(group)}'>${group.name}</option>`
        ).join('');

        const html = `<div class="groupReport" id="groupReport_${localGroupIndex}">
        <h4>Group Report</h4>
        <label for="groupName_${localGroupIndex}">${labels.groupName}</label>
        <select id="groupName_${localGroupIndex}" name="groupReports[${localGroupIndex}].groupName" required>
            <option value="">${labels.selectGroup}</option>
            ${groupOptions}
        </select>

        <div class="frame">
            <h5>Combat</h5>
            <label>Places:</label>
            <select id="fightingPlaceIds_${localGroupIndex}" multiple></select>
            <label>Contractors:</label>
            <select id="fightingContractorsIds_${localGroupIndex}" multiple></select>
        </div>

        <div class="frame">
            <h5>Rest</h5>
            <label>Places:</label>
            <select id="restPlaceIds_${localGroupIndex}" multiple></select>
            <label>Contractors:</label>
            <select id="restContractorsIds_${localGroupIndex}" multiple></select>
        </div>

        <label for="groupDescription_${localGroupIndex}">${labels.description}</label>
        <textarea id="groupDescription_${localGroupIndex}" name="groupReports[${localGroupIndex}].description" rows="2"></textarea>

        <input type="hidden" name="groupReports[${localGroupIndex}].worked" value="true" />

        <div id="hiddenInputsContainer_${localGroupIndex}"></div>

        <div class="frame">
        <label>Ammunition:</label>
        <div class="align-right">
            <button type="button" onclick="toggleAmmunition('${localGroupIndex}')">Show/Hide Ammo</button>
        </div>
        <div id="ammunitionContainer_${localGroupIndex}" style="display:none; margin-top: 5px;">
            <textarea name="groupReports[${localGroupIndex}].ammunition" rows="2" placeholder="Enter ammunition details..."></textarea>
        </div>
        </div>

        <input type="hidden" name="groupReports[${localGroupIndex}].worked" value="true" />
        <div id="hiddenInputsContainer_${localGroupIndex}"></div>



        <div class="flex-buttons">
            <button type="button" class="removeGroupReport" data-group-id="groupReport_${localGroupIndex}">${labels.remove}</button>
        </div>


    </div>`;

        $("#groupReportsContainer").append(html);
        bindMutualExclusion(`fightingPlaceIds_${localGroupIndex}`, `restPlaceIds_${localGroupIndex}`);
        bindMutualExclusion(`fightingContractorsIds_${localGroupIndex}`, `restContractorsIds_${localGroupIndex}`);

        $(`#groupName_${localGroupIndex}`).trigger("change");
        groupIndex++;
    }

    function updateManualContractorSelect() {
        const usedIds = new Set();

        $("#arrivedContractorsContainer input[name='arrivedContractorIds']").each(function () {
            usedIds.add($(this).val());
        });

        $("#departedContractorsContainer input[name='departedContractorIds']").each(function () {
            usedIds.add($(this).val());
        });

        $("#manualContractorSelect option").each(function () {
            const id = $(this).val();
            $(this).prop("disabled", usedIds.has(id));
        });
    }

    // Call after adding/removing contractor
    $("#addToArrived, #addToDeparted").click(updateManualContractorSelect);
    $(document).on("click", ".removeContractor", updateManualContractorSelect);


    $(document).on("change", "select[id^='groupName_']", function () {
        const $this = $(this);
        const idx = $this.attr("id").split("_")[1];
        const selectedOption = $this.find("option:selected");
        const groupData = selectedOption.data("group");
        if (!groupData) return;

        const fightingPlaceOptions = (groupData.places || []).filter(p => Number(p.coeficient) === 100)
            .map(p => `<option value="${p.id}" data-coef="${p.coeficient}">${p.name} (${p.coeficient})</option>`).join('');
        $(`#fightingPlaceIds_${idx}`).html(fightingPlaceOptions);

        const restPlaceOptions = (groupData.places || []).filter(p => Number(p.coeficient) === 30)
            .map(p => `<option value="${p.id}" data-coef="${p.coeficient}">${p.name} (${p.coeficient})</option>`).join('');
        $(`#restPlaceIds_${idx}`).html(restPlaceOptions);

        const contractorOptions = (groupData.contractors || []).map(c =>
            `<option value="${c.id}">${contractorLabel(c)}</option>`).join('');
        $(`#fightingContractorsIds_${idx}`).html(contractorOptions);
        $(`#restContractorsIds_${idx}`).html(contractorOptions);

        $(`#groupDescription_${idx}`).val(groupData.defaultDescription || '');
    });

    $("#regionReportForm").on("submit", function () {
        $("[id^='groupReport_']").each(function () {
            const idx = this.id.split('_')[1];
            const container = $(`#hiddenInputsContainer_${idx}`).empty();

            const allPlaces = {};
            $(`#fightingPlaceIds_${idx} option:selected, #restPlaceIds_${idx} option:selected`).each(function () {
                const coef = $(this).data("coef") || 0;
                allPlaces[$(this).val()] = coef;
            });

            for (const [placeId, coef] of Object.entries(allPlaces)) {
                container.append(`<input type="hidden" name="groupReports[${idx}].placeCoefficients[${placeId}]" value="${coef}">`);
            }

            const appendMap = (contractors, places) => {
                contractors.forEach(cid => {
                    places.forEach(pid => {
                        container.append(`<input type="hidden" name="groupReports[${idx}].contractorPlaceMap[${cid}][]" value="${pid}"/>`);
                    });
                });
            };

            const fightC = $(`#fightingContractorsIds_${idx}`).val() || [];
            const restC = $(`#restContractorsIds_${idx}`).val() || [];
            const fightP = $(`#fightingPlaceIds_${idx}`).val() || [];
            const restP = $(`#restPlaceIds_${idx}`).val() || [];

            appendMap(fightC, fightP);
            appendMap(restC, restP);

            const allContractorIds = new Set([...fightC, ...restC]);
            for (const contractorId of allContractorIds) {
                container.append(`<input type="hidden" name="groupReports[${idx}].contractorsIds" value="${contractorId}" />`);
            }
        });
    });

    function toggleAmmunition(index) {
        const container = document.getElementById(`ammunitionContainer_${index}`);
        if (container) {
            container.style.display = container.style.display === 'none' ? 'block' : 'none';
        }
    }


    $(document).ready(function () {
        $("#regionName, #reportDate").on("change", function () {
            loadContractorsForSelectedDateAndRegion();

            const regionId = $("#regionName").val();
            const filteredGroups = groups.filter(g => g.regionId == regionId);

            $("#groupReportsContainer").empty();
            groupIndex = 0;

            $("#addGroupReport").off("click").on("click", function () {
                addGroupReportEntry(filteredGroups);
            });

            $("#addGroupReport").click();
        });

        $("#regionReportForm").on("submit", function (e) {
            const arrived = new Set();
            const departed = new Set();

            $("#arrivedContractorsContainer input[name='arrivedContractorIds']").each(function () {
                arrived.add($(this).val());
            });
            $("#departedContractorsContainer input[name='departedContractorIds']").each(function () {
                departed.add($(this).val());
            });

            for (let id of arrived) {
                if (departed.has(id)) {
                    alert("❗ Contractor cannot be both arrived and departed: " + id);
                    e.preventDefault(); // block form submission
                    return false;
                }
            }
        });


        $(document).on("click", ".removeContractor", function () {
            const $entry = $(this).closest(".contractor-entry");
            const id = $entry.find("input").val();
            const label = $entry.find("span").text();
            if (!$("#manualContractorSelect option[value='" + id + "']").length) {
                $("#manualContractorSelect").append(`<option value="${id}">${label}</option>`);
            }
            $entry.remove();
        });

        $(document).on("click", ".removeExtraData", function () {
            $(this).parent().remove();
        });

        $(document).on("click", ".removeGroupReport", function () {
            $("#" + $(this).data("group-id")).remove();
        });

        $("#addToArrived").click(() => {
            const $sel = $("#manualContractorSelect");
            const id = $sel.val();
            const label = $sel.find("option:selected").text();
            if (!id) return;
            $("#arrivedContractorsContainer").append(createContractorInput("arrivedContractorIds", id, label));
            $sel.find(`option[value="${id}"]`).remove();
        });

        $("#addToDeparted").click(() => {
            const $sel = $("#manualContractorSelect");
            const id = $sel.val();
            const label = $sel.find("option:selected").text();
            if (!id) return;
            $("#departedContractorsContainer").append(createContractorInput("departedContractorIds", id, label));
            $sel.find(`option[value="${id}"]`).remove();
        });

        $("#addExtraData").click(function () {
            $("#extraDataContainer").append($("#extraDataTemplate").html());
        });
    });
    /*]]>*/
</script>

</div>
</body>
</html>
