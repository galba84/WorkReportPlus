<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Report</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<!-- Include the header fragment -->
<div th:insert="~{fragments/header :: body}"></div>

<h2>Submit New Region Report</h2>

<!-- Success Message -->
<div th:if="${successMessage}" style="color: green;">
    <p th:text="${successMessage}"></p>
</div>

<!-- Error Message -->
<div th:if="${errorMessage}" style="color: red;">
    <p th:text="${errorMessage}"></p>
</div>

<form id="regionReportForm" th:action="@{/api/daily-work-report}" method="post">

    <!-- Date Picker -->
    <label for="reportDate">Report Date:</label>
    <input type="date" id="reportDate" name="reportDate" required>

    <!-- Region Dropdown -->
    <label for="regionName">Region:</label>
    <select id="regionName" name="regionName">
        <option value="">-- Select Region --</option>
        <option th:each="regionName : ${regionNames}" th:value="${regionName}" th:text="${regionName}"></option>
    </select>

    <!-- Region Report Description -->
    <label for="regionDescription">Description:</label>
    <textarea id="regionDescription" name="regionDescription" rows="3"></textarea>

    <!-- Group Reports Container -->
    <h3>Group Reports</h3>
    <div id="groupReportsContainer">
        <!-- Group reports will be dynamically added here -->
    </div>

    <!-- Add Group Report Button -->
    <button type="button" id="addGroupReport">+ Add Group Report</button>

    <!-- Submit Button -->
    <button type="submit">Submit Report</button>
</form>

<!-- JavaScript to Handle Dynamic Group Reports -->
<script>
    $(document).ready(function () {
        let groupIndex = 0;

        // Function to Add New Group Report
        $("#addGroupReport").click(function () {
            let groupReportHtml = `
                <div class="groupReport" id="groupReport_${groupIndex}">
                    <h4>Group Report</h4>

                    <label for="groupName_${groupIndex}">Group Name:</label>
                    <select id="groupName_${groupIndex}" name="groupReports[${groupIndex}].groupName" required>
                        <option value="">Select Group</option>
                        <option value="Group A">Group A</option>
                        <option value="Group B">Group B</option>
                        <option value="Group C">Group C</option>
                    </select>

                   <label for="contractorsIds_${groupIndex}">Contractors:</label>
                    <select id="contractorsIds_${groupIndex}" name="groupReports[${groupIndex}].contractorsIds" multiple required>
                        <option value="1">Ivanov A</option>
                        <option value="2">Petrov B</option>
                        <option value="3">Sidoroff C</option>
                    </select>

                    <label for="placeIds_${groupIndex}">Places:</label>
                    <select id="placeIds_${groupIndex}" name="groupReports[${groupIndex}].placeIds" multiple required>
                        <option value="1">Site 1</option>
                        <option value="2">Site 2</option>
                        <option value="3">Site 3</option>
                    </select>



                    <label for="groupDescription_${groupIndex}">worked ? :</label>
                    <input type="checkbox" id="worked${groupIndex}" name="groupReports[${groupIndex}].worked" value="true">

                    <label for="groupDescription_${groupIndex}">Description:</label>
                    <textarea id="groupDescription_${groupIndex}" name="groupReports[${groupIndex}].description" rows="2"></textarea>

                    <button type="button" class="removeGroupReport" data-group-id="groupReport_${groupIndex}">Remove</button>
                </div>
            `;

            $("#groupReportsContainer").append(groupReportHtml);
            groupIndex++;
        });

        // Function to Remove Group Report
        $(document).on("click", ".removeGroupReport", function () {
            let groupId = $(this).data("group-id");
            $("#" + groupId).remove();
        });
    });
</script>

</body>
</html>
