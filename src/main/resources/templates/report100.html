<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{page.title.attendanceTable}">Attendance Table</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .report-frame {
            margin-top: 30px;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }

        .report-frame h3 {
            margin-top: 0;
            color: #333;
        }

        .form-container {
            margin-bottom: 30px;
        }

        table.full-width-table {
            width: 100%;
            border-collapse: collapse;
        }

        table.full-width-table th, table.full-width-table td {
            border: 1px solid #aaa;
            padding: 5px;
            text-align: center;
        }

        table.full-width-table th {
            background-color: #efefef;
        }
    </style>
</head>
<body>

<!-- Include header -->
<div th:insert="~{fragments/header :: body}">
    <th:block th:with="infoMessage=#{attendance.message}"></th:block>
</div>

<div class="form-container">
    <h2 th:text="#{page.title.attendanceTable}">Attendance Table</h2>

    <!-- REGION + MONTH FORM -->
    <form th:action="@{/api/report100/generate}" method="get">
        <label for="regionSelect" th:text="#{form.label.region}">Select Region:</label>
        <select id="regionSelect" name="regionName" required>
            <option value="">-- Select Region --</option>
            <option th:each="region : ${regions}"
                    th:value="${region.regionName}"
                    th:text="${region.regionName}">
                Region
            </option>
        </select>

        <label for="monthSelect" th:text="#{form.label.month}">Select Month:</label>
        <input type="month" id="monthSelect" name="reportDate"
               th:value="${monthLabel}" required />

        <button type="submit" th:text="#{form.button.load}">Load Data</button>
    </form>
</div>

<!-- TABLE & EXPORT IN SEPARATE FRAME -->
<div th:if="${table != null && !table.isEmpty()}" class="report-frame">
    <h3 th:text="#{form.title.generatedReport}">Generated Report</h3>

    <p th:if="${monthLabel}" th:text="'Month: ' + ${monthLabel}">Month Info</p>

    <table class="full-width-table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Rank</th>
            <th>Nickname</th>
            <th>Group</th>
            <th th:each="day : ${daysInMonth}" th:text="${day}">Day</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${table}">
            <td th:text="${row[0]}">Name</td>
            <td th:text="${row[1]}">Rank</td>
            <td th:text="${row[2]}">Nickname</td>
            <td th:text="${row[3]}">Group</td>
            <td th:each="i : ${#numbers.sequence(4, row.size() - 1)}"
                th:text="${row[i]}">Coef</td>
        </tr>

        </tbody>
    </table>

    <!-- Excel download -->
    <form th:action="@{/api/report100/export}" method="get" style="margin-top: 15px;">
        <input type="hidden" name="regionName" th:value="${selectedRegion}" />
        <input type="hidden" name="reportDate" th:value="${monthLabel + '-01'}" />
        <button type="submit" th:text="#{form.button.excel}">Generate Excel</button>
    </form>
</div>

</body>
</html>
