<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Header</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Language Switcher -->
<div class="language-switcher">
    <span th:text="#{language.label}">Language</span>:
    <a th:href="@{/change-lang(lang='en')}" th:classappend="${#locale.language == 'en'} ? 'active'">English</a> |
    <a th:href="@{/change-lang(lang='uk')}" th:classappend="${#locale.language == 'uk'} ? 'active'">Українська</a>
</div>

<div class="header">

    <!-- Info message dynamically set -->
    <div class="info-message" th:text="${infoMessage}">Default Info Message</div>

    <!-- DEBUG: Show current user roles -->
    <div th:if="${#authentication != null and #authentication.isAuthenticated()}">
        <p>Roles:
            <span th:each="role : ${#authentication.authorities}"
                  th:text="${role.getAuthority()} + ' '">ROLE</span>
        </p>
    </div>

    <!-- User Information (If Logged In) -->
    <div class="user-info" th:if="${#authentication != null and #authentication.isAuthenticated()}">
        <span th:text="#{welcome}">Welcome,</span>
        <b th:if="${#authentication.principal instanceof T(org.springframework.security.oauth2.core.user.OAuth2User)}"
           th:text="${#authentication.principal.attributes['email']}">User</b>
        <b th:unless="${#authentication.principal instanceof T(org.springframework.security.oauth2.core.user.OAuth2User)}"
           th:text="${#authentication.name}">User</b>
    </div>

    <!-- Separator -->
    <hr>

    <!-- Navigation Menu -->
    <div class="menu">

        <!-- Row 1: Common navigation -->
        <div class="menu-row">
            <a th:href="@{/index}" th:text="#{menu.home}">HOME</a>
            <a th:href="@{/api/daily-work-report}" th:text="#{menu.newReport}">New Report</a>
            <a th:href="@{/api/daily-work-report/search}" th:text="#{menu.searchReport}">Search Report</a>
            <a th:href="@{/api/daily-work-report/export}" th:text="#{menu.exportReport}">Export Report</a>
            <a th:href="@{/api/report100}" th:text="#{menu.report100}">Report100</a>
            <!-- Logout button -->
            <div class="menu-row logout-button">
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <button type="submit" th:text="#{menu.logout}">Logout</button>
                </form>
            </div>
        </div>

        <!-- Row 2: ADMIN-only buttons -->
        <div class="menu-row admin-menu" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            <a th:href="@{/admin}" th:text="#{menu.adminPage}">Admin Page</a>
            <a th:href="@{/audit-log/admin}" th:text="#{menu.auditLog}">Logs</a>
            <a th:href="@{/users}" th:text="#{menu.usersPage}">Users Page</a>
            <a th:href="@{/sheets-viewer.html}" th:text="#{menu.sheetsViewer}">Viewer</a>
        </div>


    </div>


</div>

</body>
</html>
