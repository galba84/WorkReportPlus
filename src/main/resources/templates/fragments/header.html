<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Header</title>
</head>
<body>
<div class="header">
    <!-- Info message dynamically set -->
    <div class="info-message" th:text="${infoMessage}">Default Info Message</div>

    <!-- User Information (If Logged In) -->
    <div class="user-info" th:if="${#authentication.isAuthenticated()}">
        <span>Welcome,
            <b th:if="${#authentication.principal instanceof T(org.springframework.security.oauth2.core.user.OAuth2User)}"
               th:text="${#authentication.principal.attributes['email']}">User</b>

            <b th:unless="${#authentication.principal instanceof T(org.springframework.security.oauth2.core.user.OAuth2User)}"
               th:text="${#authentication.name}">User</b>
        </span>
    </div>

    <!-- Separator -->
    <hr>

    <!-- Navigation Menu -->
    <div class="menu">
        <a th:href="@{/api/daily-work-report}">New Report</a>
        <a th:href="@{/api/daily-work-report/search}">Search Report</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Logout</button>
        </form>
    </div>
</div>

<script>
    function clearCookies() {
        document.cookie.split(";").forEach(function(cookie) {
            document.cookie = cookie.replace(/^ +/, "")
                .replace(/=.*/, "=;expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/");
        });
    }
    window.onload = clearCookies;
</script>

</body>
</html>
