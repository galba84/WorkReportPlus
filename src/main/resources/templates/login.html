<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{page.title.login}">Login</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <style>
        body {
            background-image: url('/img/banner1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
        }

        .form-container {
            background-color: rgba(0, 0, 0, 0.6); /* Dark overlay for contrast */
            color: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            margin: 80px auto;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }

        a {
            color: #aad8ff;
        }
    </style>

</head>

<body>

<div class="form-container">
    <h2 th:text="#{page.title.login}">Login</h2>

    <form th:action="@{/login}" method="post">
        <label for="username" th:text="#{form.email}">Email:</label>
        <input type="text" id="username" name="username" required>

        <label for="password" th:text="#{form.password}">Password:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" th:text="#{form.login}">Login</button>
    </form>

    <p style="margin-top: 15px;">
        <a th:href="@{/register}" th:text="#{form.registerLink}">Don't have an account? Register</a>
    </p>

    <p th:if="${param.registered}" style="color: green;">✅ <span th:text="#{form.registerSuccess}">Successfully registered!</span></p>
    <p th:if="${param.error}" style="color: red;">❌ <span th:text="#{form.loginError}">Invalid email or password.</span></p>
</div>

</body>
</html>
