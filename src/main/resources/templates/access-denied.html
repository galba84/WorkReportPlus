<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Access Denied</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<!-- Include the header fragment -->
<div th:insert="~{fragments/header :: body}">
    <!-- Pass the info message -->
    <th:block th:with="infoMessage='Welcome to the Report System'"></th:block>
</div>


<h1 th:text="#{error.accessDenied}">Access Denied</h1>
<p th:text="#{error.notEnoughRights}">You do not have permission to access this page.</p>
<a th:href="@{/}">Return to Home</a>
</body>
</html>
