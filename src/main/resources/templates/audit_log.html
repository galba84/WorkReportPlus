<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras/springsecurity5">
<head>
    <meta charset="UTF-8">
    <title th:text="#{page.title.logs}">Audit Log</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"> <!-- optional -->
</head>
<body>

<!-- Include the header fragment -->
<div th:insert="~{fragments/header :: body}">
    <th:block th:with="infoMessage=#{admin.page.info.message}"></th:block>
</div>

<!-- Info message -->
<div th:if="${infoMessage != null}" class="alert alert-info">
    <p th:text="${infoMessage}"></p>
</div>

<div class="container my-4">
    <h1 class="mb-3" th:text="#{page.heading.logs}">Audit Log</h1>

    <!-- Show if auditLogs is empty -->
    <div th:if="${#lists.isEmpty(auditLogs)}" class="alert alert-warning">
        <p>No audit log entries found.</p>
    </div>

    <!-- Table of audit logs -->
    <div th:if="${not #lists.isEmpty(auditLogs)}" class="table-responsive">
        <table class="table table-bordered table-striped table-sm">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Action</th>
                <th>Service</th>
                <th>Entity ID</th>
                <th>User ID</th>
                <th>IP Address</th>
                <th>Timestamp</th>
                <th>Details</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="log : ${auditLogs}">
                <td th:text="${log.id}">--</td>
                <td th:text="${log.action}">--</td>
                <td th:text="${log.serviceId}">--</td>
                <td th:text="${log.entityId}">--</td>
                <td th:text="${log.userId}">--</td>
                <td th:text="${log.ipAddress}">--</td>
                <td th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}">--</td>
                <td th:text="${log.details}">--</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
