spring.profiles.default=demo
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/workreportplus}
spring.datasource.username=${DB_USER:workreportplus}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.messages.basename=messages
spring.messages.encoding=UTF-8
server.port=8082
server.error.include-message=never
server.error.include-stacktrace=never
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m
app.jwt.secret=${JWT_SECRET:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.origins=${CORS_ORIGINS:http://localhost:5178}
app.google.enabled=${GOOGLE_ENABLED:false}
app.google.credentials-file=${GOOGLE_CREDENTIALS_FILE:}
app.google.personnel-sheet-id=${GOOGLE_PERSONNEL_SHEET_ID:}
app.google.reference-sheet-id=${GOOGLE_REFERENCE_SHEET_ID:}
app.google.operations-primary-sheet-id=${GOOGLE_OPERATIONS_PRIMARY_SHEET_ID:}
app.google.operations-secondary-sheet-id=${GOOGLE_OPERATIONS_SECONDARY_SHEET_ID:}
